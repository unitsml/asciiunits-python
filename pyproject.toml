[build-system]
requires = ["setuptools>=69", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "asciiunits"
version = "0.1.0"
description = "Native structural parser for edition-2 AsciiUnits expressions"
requires-python = ">=3.9"
license = {file = "LICENSE.md"}
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
